<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dartmoor Tors</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Dartmoor Tors</h1>
    <span class="sub">Tors of Dartmoor</span>
    <span id="tor-data-status" role="status" aria-live="polite"></span>
    <span id="stats"></span>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="panel">
      <h2>Legend</h2>
      <div class="legend-row"><span class="tri" style="border-bottom-color:var(--run)"></span> Run</div>
      <div class="legend-row"><span class="tri" style="border-bottom-color:var(--hike)"></span> Hike</div>
      <div class="legend-row"><span class="tri" style="border-bottom-color:var(--blank)"></span> Not yet done</div>
      <div class="legend-row">
        <svg class="home-legend-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5h-6v-6.2h-5V21h-6a.5.5 0 0 1-.5-.5z"/></svg>
        Home
      </div>

      <h2 style="margin-top:20px;">Filter</h2>
      <fieldset id="filters">
        <label class="check"><input type="checkbox" value="R" checked> Run</label>
        <label class="check"><input type="checkbox" value="H" checked> Hike</label>
        <label class="check"><input type="checkbox" value="" checked> Not yet done</label>
      </fieldset>

      <h2>Find a tor</h2>
      <input type="search" id="search" placeholder="Search by name…">
      <ul id="list"></ul>

      <h2 style="margin-top:20px;">Strava</h2>
      <button id="connect-strava" class="btn" type="button">Connect Strava</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
