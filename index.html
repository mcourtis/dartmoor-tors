<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dartmoor Tors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --moor-brown:#5b4636;
    --moor-green:#3d5a3d;
    --granite:#8d8478;
    --cream:#f2efe6;
    --ink:#2b2620;
    --run:#b5482f;
    --hike:#3f7a52;
    --blank:#9a9284;
  }
  * { box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--cream); color:var(--ink); }
  #app{ display:flex; flex-direction:column; height:100%; }

  header{
    padding:14px 20px;
    background:var(--moor-brown);
    color:var(--cream);
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:1.15rem;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  header .sub{
    font-size:0.82rem;
    opacity:0.8;
  }
  #stats{
    margin-left:auto;
    font-size:0.82rem;
    opacity:0.92;
  }

  #main{ flex:1; display:flex; min-height:0; }
  #map{ flex:1; }

  #panel{
    width:240px;
    background:#fff;
    border-left:1px solid #ddd6c9;
    padding:16px;
    overflow-y:auto;
    font-size:0.85rem;
  }
  #panel h2{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--granite);
    margin:0 0 10px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:9px;
  }
  .tri{
    width:0; height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:14px solid var(--blank);
    flex-shrink:0;
  }
  .tri.hollow{
    border-bottom-color: transparent;
    position:relative;
  }
  .tri.hollow::after{
    content:'';
    position:absolute;
    left:-6px; top:2.5px;
    width:0; height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:10px solid #fff;
  }
  fieldset{
    border:none;
    padding:0;
    margin:0 0 18px;
  }
  label.check{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:7px;
    cursor:pointer;
  }
  input[type=search]{
    width:100%;
    padding:7px 9px;
    border:1px solid #ddd6c9;
    border-radius:3px;
    font-size:0.85rem;
    margin-bottom:18px;
  }
  #list{
    list-style:none;
    margin:0; padding:0;
    max-height:100%;
  }
  #list li{
    padding:6px 0;
    border-bottom:1px solid #f0ece1;
    cursor:pointer;
    line-height:1.35;
  }
  #list li:hover{ color:var(--run); }
  #list .h-name{ display:block; font-weight:600; }
  #list .h-meta{ display:block; font-size:0.75rem; color:var(--granite); }

  .leaflet-popup-content-wrapper{ border-radius:4px; }
  .leaflet-popup-content{ font-size:0.85rem; margin:10px 12px; }
  .popup-title{ font-weight:700; margin-bottom:2px; }
  .popup-meta{ color:var(--granite); font-size:0.8rem; }
  .approx-flag{ color:var(--run); font-size:0.75rem; }

  @media (max-width:720px){
    #main{ flex-direction:column; }
    #panel{ width:auto; border-left:none; border-top:1px solid #ddd6c9; max-height:38vh; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Dartmoor Tors</h1>
    <span class="sub">221 tors · triangle = tor · fill colour = mode done</span>
    <span id="stats"></span>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="panel">
      <h2>Legend</h2>
      <div class="legend-row"><span class="tri" style="border-bottom-color:var(--run)"></span> Run</div>
      <div class="legend-row"><span class="tri" style="border-bottom-color:var(--hike)"></span> Hike</div>
      <div class="legend-row"><span class="tri" style="border-bottom-color:var(--blank)"></span> Not yet done</div>
      <div class="legend-row">
        <svg width="16" height="15" viewBox="0 0 18 17" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
          <defs><pattern id="legend-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="4" height="4" fill="#8d8478"/>
            <line x1="0" y1="0" x2="0" y2="4" stroke="#ffffff" stroke-width="1.6"/>
          </pattern></defs>
          <polygon points="9,1 17,16 1,16" fill="url(#legend-hatch)" stroke="#8d8478" stroke-width="0.75"/>
        </svg>
        Approx. location <span class="approx-flag">(hatched, any colour — low‑precision ref)</span>
      </div>

      <h2 style="margin-top:20px;">Filter</h2>
      <fieldset id="filters">
        <label class="check"><input type="checkbox" value="R" checked> Run</label>
        <label class="check"><input type="checkbox" value="H" checked> Hike</label>
        <label class="check"><input type="checkbox" value="" checked> Not yet done</label>
      </fieldset>

      <h2>Find a tor</h2>
      <input type="search" id="search" placeholder="Search by name…">
      <ul id="list"></ul>
    </div>
  </div>
</div>

/* ---------- 2. OS National Grid -> WGS84 lat/lon ---------- */
// SX 100km square false origin (metres): easting 200000, northing 0
function sxRefToEN(ref){
  const digits = ref.replace(/^SX/i,"").trim();
  const n = digits.length/2;
  const scale = Math.pow(10, 5-n);
  const e = 200000 + Number(digits.slice(0,n))*scale;
  const nn = 0 + Number(digits.slice(n))*scale;
  return {e, n:nn};
}
function gridXYToEN(gx, gy){
  // Grid X/Y columns are in km (not tens of km) within the SX 100km square;
  // centre of the 1km cell they identify.
  return { e: 200000 + gx*1000 + 500, n: 0 + gy*1000 + 500 };
}
function osGridToLatLonOSGB36(E, N){
  const a=6377563.396, b=6356256.909, F0=0.9996012717;
  const lat0=49*Math.PI/180, lon0=-2*Math.PI/180;
  const N0=-100000, E0=400000;
  const e2=1-(b*b)/(a*a);
  const n=(a-b)/(a+b), n2=n*n, n3=n*n*n;
  let lat=lat0, M=0;
  do{
    lat = (N-N0-M)/(a*F0) + lat;
    const Ma=(1+n+(5/4)*n2+(5/4)*n3)*(lat-lat0);
    const Mb=(3*n+3*n2+(21/8)*n3)*Math.sin(lat-lat0)*Math.cos(lat+lat0);
    const Mc=((15/8)*n2+(15/8)*n3)*Math.sin(2*(lat-lat0))*Math.cos(2*(lat+lat0));
    const Md=(35/24)*n3*Math.sin(3*(lat-lat0))*Math.cos(3*(lat+lat0));
    M = b*F0*(Ma-Mb+Mc-Md);
  } while (N-N0-M >= 0.00001);

  const cosLat=Math.cos(lat), sinLat=Math.sin(lat);
  const nu=a*F0/Math.sqrt(1-e2*sinLat*sinLat);
  const rho=a*F0*(1-e2)/Math.pow(1-e2*sinLat*sinLat,1.5);
  const eta2=nu/rho-1;
  const tanLat=Math.tan(lat);
  const tan2=tanLat*tanLat, tan4=tan2*tan2, tan6=tan4*tan2;
  const secLat=1/cosLat;
  const nu3=nu*nu*nu, nu5=nu3*nu*nu, nu7=nu5*nu*nu;

  const VII = tanLat/(2*rho*nu);
  const VIII = tanLat/(24*rho*nu3)*(5+3*tan2+eta2-9*tan2*eta2);
  const IX = tanLat/(720*rho*nu5)*(61+90*tan2+45*tan4);
  const X = secLat/nu;
  const XI = secLat/(6*nu3)*(nu/rho+2*tan2);
  const XII = secLat/(120*nu5)*(5+28*tan2+24*tan4);
  const XIIA = secLat/(5040*nu7)*(61+662*tan2+1320*tan4+720*tan6);

  const dE=E-E0, dE2=dE*dE, dE3=dE2*dE, dE4=dE2*dE2, dE5=dE3*dE2, dE6=dE4*dE2, dE7=dE5*dE2;
  const finalLat = lat - VII*dE2 + VIII*dE4 - IX*dE6;
  const finalLon = lon0 + X*dE - XI*dE3 + XII*dE5 - XIIA*dE7;
  return { lat: finalLat*180/Math.PI, lon: finalLon*180/Math.PI };
}
function osgb36ToWGS84(lat, lon){
  const phi=lat*Math.PI/180, lambda=lon*Math.PI/180;
  const a1=6377563.396, b1=6356256.909;
  const e2=1-(b1*b1)/(a1*a1);
  const sinP=Math.sin(phi), cosP=Math.cos(phi), sinL=Math.sin(lambda), cosL=Math.cos(lambda);
  const nu=a1/Math.sqrt(1-e2*sinP*sinP);
  const x1=nu*cosP*cosL, y1=nu*cosP*sinL, z1=(1-e2)*nu*sinP;

  const tx=446.448, ty=-125.157, tz=542.060;
  const s=-20.4894e-6;
  const rx=(0.1502/3600)*Math.PI/180, ry=(0.2470/3600)*Math.PI/180, rz=(0.8421/3600)*Math.PI/180;

  const x2 = tx + (1+s)*x1 + (-rz)*y1 + ( ry)*z1;
  const y2 = ty + ( rz)*x1 + (1+s)*y1 + (-rx)*z1;
  const z2 = tz + (-ry)*x1 + ( rx)*y1 + (1+s)*z1;

  const a2=6378137.000, b2=6356752.3141;
  const e2b=1-(b2*b2)/(a2*a2);
  const p=Math.sqrt(x2*x2+y2*y2);
  let phi2=Math.atan2(z2, p*(1-e2b));
  for(let i=0;i<10;i++){
    const sp=Math.sin(phi2);
    const nu2=a2/Math.sqrt(1-e2b*sp*sp);
    phi2=Math.atan2(z2+e2b*nu2*sp, p);
  }
  const lambda2=Math.atan2(y2,x2);
  return { lat: phi2*180/Math.PI, lon: lambda2*180/Math.PI };
}
function toLatLon(E,N){
  const g = osGridToLatLonOSGB36(E,N);
  return osgb36ToWGS84(g.lat, g.lon);
}

/* ---------- 3. Build tor objects ---------- */
const TORS = RAW.map(r=>{
  const [name, ref, height, mode, book, mapCol, gx, gy] = r;
  const lowPrecision = !ref;
  const en = lowPrecision ? gridXYToEN(gx, gy) : sxRefToEN(ref);
  const ll = toLatLon(en.e, en.n);
  return { name, ref: ref || `(from grid ${gx}/${gy})`, height, mode, book, mapCol, lowPrecision, lat: ll.lat, lon: ll.lon };
});

/* ---------- 4. Map + markers ---------- */
const map = L.map('map', { zoomControl:true }).setView([50.585, -3.97], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom:19,
  subdomains:'abcd',
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

const colorFor = m => m==='R' ? 'var(--run)'.replace('var(--run)', getCss('--run'))
                     : m==='H' ? getCss('--hike')
                     : getCss('--blank');
function getCss(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

let hatchCounter = 0;
function triIcon(tor){
  const color = tor.mode==='R' ? getCss('--run') : tor.mode==='H' ? getCss('--hike') : getCss('--blank');
  if (!tor.lowPrecision){
    const svg = `<svg width="18" height="17" viewBox="0 0 18 17" xmlns="http://www.w3.org/2000/svg"><polygon points="9,1 17,16 1,16" fill="${color}"/></svg>`;
    return L.divIcon({ html: svg, className:'', iconSize:[18,17], iconAnchor:[9,16], popupAnchor:[0,-16] });
  }
  // low-precision tors: hatch the fill (in the same mode colour) instead of a solid fill,
  // so approx. location stays visually distinct regardless of red/green/grey
  const uid = 'hatch' + (hatchCounter++);
  const svg = `<svg width="18" height="17" viewBox="0 0 18 17" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="${uid}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="${color}"/>
      <line x1="0" y1="0" x2="0" y2="4" stroke="#ffffff" stroke-width="1.6"/>
    </pattern></defs>
    <polygon points="9,1 17,16 1,16" fill="url(#${uid})" stroke="${color}" stroke-width="0.75"/>
  </svg>`;
  return L.divIcon({ html: svg, className:'', iconSize:[18,17], iconAnchor:[9,16], popupAnchor:[0,-16] });
}

const markers = TORS.map(tor=>{
  const m = L.marker([tor.lat, tor.lon], { icon: triIcon(tor) });
  const modeLabel = tor.mode==='R' ? 'Run' : tor.mode==='H' ? 'Hike' : 'Not yet done';
  m.bindPopup(
    `<div class="popup-title">${tor.name}</div>` +
    `<div class="popup-meta">${tor.height} m · ${modeLabel}</div>` +
    `<div class="popup-meta">${tor.ref}</div>` +
    (tor.lowPrecision ? `<div class="approx-flag">Approximate location — grid ref in source data was incomplete</div>` : '')
  );
  m.tor = tor;
  return m;
});
const layer = L.layerGroup(markers).addTo(map);

/* ---------- 5. Filters ---------- */
function applyFilters(){
  const checked = Array.from(document.querySelectorAll('#filters input:checked')).map(i=>i.value);
  layer.clearLayers();
  markers.forEach(m=>{
    if (checked.includes(m.tor.mode)) layer.addLayer(m);
  });
  updateStats(checked);
}
document.querySelectorAll('#filters input').forEach(i=>i.addEventListener('change', applyFilters));

function updateStats(checked){
  const shown = markers.filter(m=>checked.includes(m.tor.mode)).length;
  const done = TORS.filter(t=>t.mode).length;
  document.getElementById('stats').textContent = `${done} / ${TORS.length} done · showing ${shown}`;
}

/* ---------- 6. Sidebar list + search ---------- */
const listEl = document.getElementById('list');
function renderList(filterText){
  listEl.innerHTML = '';
  const q = (filterText||'').toLowerCase();
  TORS
    .filter(t=>t.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(t=>{
      const li = document.createElement('li');
      const modeLabel = t.mode==='R' ? 'Run' : t.mode==='H' ? 'Hike' : 'Not done';
      li.innerHTML = `<span class="h-name">${t.name}</span><span class="h-meta">${t.height} m · ${modeLabel}${t.lowPrecision?' · approx.':''}</span>`;
      li.addEventListener('click', ()=>{
        map.setView([t.lat,t.lon], 15);
        const marker = markers.find(m=>m.tor===t);
        if (marker){ if(!layer.hasLayer(marker)) layer.addLayer(marker); marker.openPopup(); }
      });
      listEl.appendChild(li);
    });
}
document.getElementById('search').addEventListener('input', e=>renderList(e.target.value));

renderList('');
applyFilters();
</script>
</body>
</html>
