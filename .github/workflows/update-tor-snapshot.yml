name: Refresh tor snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-tor-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate snapshot
        run: python scripts/update_tor_snapshot.py
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/tors.js; then
            echo 'Tor snapshot is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/tors.js
            git commit -m 'Refresh tor snapshot from spreadsheet'
            git push
          fi
